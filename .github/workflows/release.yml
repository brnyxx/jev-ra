name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: uv build

      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          built="$(uv run --no-project python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tagged" != "$built" ]; then
            echo "tag $GITHUB_REF_NAME does not match project version $built" >&2
            exit 1
          fi

      - name: Smoke test the wheel
        run: |
          cd "$(mktemp -d)"
          uvx --from "$GITHUB_WORKSPACE"/dist/*.whl jev-ra --version

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_TRUSTED == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
