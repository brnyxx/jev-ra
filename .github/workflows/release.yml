name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org

      - name: Every version agrees with the tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            uv run --no-project python scripts/check_versions.py \
              --tag "$GITHUB_REF_NAME"
          else
            uv run --no-project python scripts/check_versions.py
          fi

      - name: Build wheel and sdist
        run: uv build

      - name: Smoke test the wheel
        run: |
          cd "$(mktemp -d)"
          uvx --from "$GITHUB_WORKSPACE"/dist/*.whl jev-ra --version

      - name: Test the npm launcher
        working-directory: npm
        run: |
          npm test
          npm pack --dry-run

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_TRUSTED == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org

      - name: Publish the launcher
        working-directory: npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
