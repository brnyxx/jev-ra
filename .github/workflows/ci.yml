name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      BU_CDP_URL: http://127.0.0.1:9222
      JEV_RA_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Start Chrome with remote debugging
        run: |
          profile="$(mktemp -d)"
          chrome --headless=new \
            --remote-debugging-port=9222 \
            --remote-debugging-address=127.0.0.1 \
            --user-data-dir="$profile" \
            --no-first-run \
            --no-default-browser-check \
            --disable-gpu \
            --window-size=1280,900 \
            --no-sandbox \
            about:blank &
          for _ in $(seq 1 30); do
            if curl -sf "$BU_CDP_URL/json/version" >/dev/null; then
              curl -sf "$BU_CDP_URL/json/version"
              exit 0
            fi
            sleep 1
          done
          echo "Chrome did not answer on $BU_CDP_URL" >&2
          exit 1

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check

      - name: Versions agree
        run: uv run python scripts/check_versions.py

      - name: Usage guide is in sync
        run: uv run python scripts/gen_usage.py --check

      - name: Translations are in sync
        run: uv run python scripts/check_i18n.py --check

      - name: The demo replays the recorded run
        run: uv run python scripts/check_demo_data.py --check

      - name: Test with coverage
        run: uv run pytest -q

      - name: Browser tests must have run
        run: uv run pytest -q -m browser --no-cov

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t jev-ra:ci .

      # No key here on purpose: the image is answering whether it found a Chrome of its own, and
      # doctor exits 1 without a key after it has said so.
      - name: The image finds its own Chrome
        run: |
          docker run --rm jev-ra:ci doctor --json > doctor.json || true
          cat doctor.json
          python -c "import json; assert json.load(open('doctor.json'))['chrome']['ok']"
