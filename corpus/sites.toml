# The real-site corpus. Forty tasks, eight families, all against the live web.
#
# Each task says what it wants to happen (`expect`) and how the page proves it (`verify`).
# `expect = "done"` means the run must finish and the verify spec must hold.
# `expect = "escalate:<reason>"` means the run must hand control back for exactly that reason;
# those tasks are not failures, they are the contract for things v0.1 deliberately does not do.
#
# verify keys: url_contains, url_not_contains, text_contains, text_any, label_any, active_label,
#              min_text

# ---------------------------------------------------------------- e-commerce: list, sort, filter

[[task]]
name = "oliveyoung_sort_newest"
family = "ecommerce"
url = "https://www.oliveyoung.co.kr/store/display/getMCategoryList.do?dispCatNo=100000100010014"
goal = "Sort this product list by 신상품순."
expect = "done"
verify = { url_contains = ["prdSort=02"] }

# Was: open the 스킨케어 category from the main page's category menu. That menu opens its second
# level on hover and on nothing else, and v0.1 has no way for a decision to ask for a hover, so
# the run stopped one click short every time. Brand filtering exercises the same listing controls
# and is a thing the shop can actually be asked for.
[[task]]
name = "oliveyoung_brand_filter"
family = "ecommerce"
url = "https://www.oliveyoung.co.kr/store/display/getMCategoryList.do?dispCatNo=100000100010014"
goal = "Filter this product list to the brand 구달."
expect = "done"
# The unfiltered listing carries an empty checkBrnds=, so the brand itself has to be in it.
verify = { url_contains = ["checkBrnds=%EA%B5%AC%EB%8B%AC"], text_any = ["구달"] }

