# ---------------------------------------------------------------- news and pagination

# The url check used to read `bbc.com`, which the index the task starts on already satisfies: a
# run that opened nothing passed it, and only min_text did any work. Every story on the news
# index lives under /news/ (articles and videos alike), and the index itself is /news with no
# slash, so the trailing slash is what says a story was opened. Tighter, and the goal is the same.
[[task]]
name = "bbc_open_story"
family = "news"
url = "https://www.bbc.com/news"
goal = "Open the first news story on this page."
expect = "done"
verify = { url_contains = ["bbc.com/news/"], min_text = 400 }

[[task]]
name = "naver_news_section"
