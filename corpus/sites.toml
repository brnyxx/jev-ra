# The goal used to say "the 공고 list", and 서울소식 has several: 입찰공고, 고시공고, 수의계약내역,
# 채용시험, 서울시보. It also has a 새소식 list at /realmnews/ whose articles mention 공고 without
# being it, which is what the old spec demanded and what made two of three runs fail on a run that
# had done as much as the goal asked. Widening the spec to accept /realmnews/ as well would have
# accepted a page that is not a 공고 list at all, and the goal never said that. So the goal names
# the list it wants, and the spec proves that one.
