# The public-benchmark tasks the accuracy lane traced, with objective page-state checks of this
# lane's own writing (no judge). Values are supplied where the task types, since no text helper
# can be reached (OpenRouter 402). Measurement only; not part of the product corpus.

[[task]]
name = "pub_flightaware_aeroapi"
family = "public"
url = "https://www.flightaware.com/"
goal = "Compare available plans for the AeroAPI on Flightaware."
max_steps = 25
verify = { url_contains = ["aeroapi"], text_any = ["Personal", "Standard", "Premium"] }

