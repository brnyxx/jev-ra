<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>#deploys</title>
<style>
  body { font: 15px/1.5 system-ui; margin: 0; display: flex; flex-direction: column; height: 100vh; }
  #log { flex: 1; overflow-y: auto; padding: 16px 24px; }
  .message { margin: 4px 0; }
  form { padding: 12px 24px 20px; }
  [role=textbox] { border: 1px solid #bbb; border-radius: 8px; padding: 10px 12px; min-height: 22px; outline: none; }
  [role=textbox]:empty::before { content: attr(data-placeholder); color: #999; }
</style>
</head>
<body>
<!-- A chat composer the way Discord draws one: a contenteditable textbox with no send button.
     Enter sends the message, Shift+Enter starts a new line, and nothing else submits it. -->
<div id="log" role="log" aria-label="Messages in #deploys">
  <div class="message"><strong>ops-bot</strong> Build 1841 is green.</div>
</div>
<form onsubmit="event.preventDefault()">
  <div role="textbox" contenteditable="true" aria-multiline="true" aria-label="Message #deploys"
       data-placeholder="Message #deploys"></div>
</form>
<script>
  const box = document.querySelector('[role=textbox]');
  box.addEventListener('keydown', event => {
    if (event.key !== 'Enter' || event.shiftKey) return;
    event.preventDefault();
    const text = box.innerText.trim();
    if (!text) return;
    const line = document.createElement('div');
    line.className = 'message';
    line.innerHTML = '<strong>you</strong> ';
    line.append(text);
    document.getElementById('log').appendChild(line);
    box.textContent = '';
  });
</script>
</body>
</html>
