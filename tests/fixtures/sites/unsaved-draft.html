<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New post</title>
<style>
  body { font: 15px/1.5 system-ui; margin: 0; padding: 24px; }
  textarea { width: 420px; height: 120px; display: block; margin: 8px 0; }
</style>
</head>
<body>
<!-- An editor the way blogs and CMSs guard a draft: once something is typed, leaving the page asks
     the browser to confirm with its before-unload dialog, and saving clears the guard. -->
<h1>New post</h1>
<nav><a href="/sites/static.html">All posts</a></nav>
<label for="body">Post body</label>
<textarea id="body"></textarea>
<button type="button" id="save">Save draft</button>
<p id="status">Nothing saved yet.</p>
<script>
  let dirty = false;
  document.getElementById('body').addEventListener('input', () => { dirty = true; });
  document.getElementById('save').addEventListener('click', () => {
    dirty = false;
    document.getElementById('status').textContent = 'Draft saved.';
  });
  addEventListener('beforeunload', event => {
    if (!dirty) return;
    event.preventDefault();
    event.returnValue = '';
  });
</script>
</body>
</html>
