<!doctype html>
<html lang="en">

<title>Long read</title>
<style>
  body { font: 14px/1.5 system-ui; margin: 0; padding: 16px; }
  .hero { height: 1200px; background: #eee; }
</style>

<body>
<!-- A news article the way a news site builds one: a headline, a hero that fills the
     first screen, and every word of the story itself below the fold. -->
<h1>UN experts publish their findings</h1>
<div class="hero">Photograph</div>
<article>
  <p>The panel said there are reasonable grounds to believe the strikes were unlawful.</p>
  <p>It called for an independent investigation and for the records to be preserved.</p>
  <p>A spokesman said the findings would be reviewed before any response was offered.</p>
</article>
