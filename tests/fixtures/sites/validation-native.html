<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create your account</title>
<style>
  body { font: 15px/1.5 system-ui; margin: 0; padding: 24px; max-width: 480px; }
  label { display: block; margin: 12px 0 4px; }
  input[type=email], input[type=text] { padding: 8px; width: 300px; }
  .check { display: flex; gap: 8px; align-items: center; margin-top: 16px; }
  .check label { margin: 0; }
  button { margin-top: 16px; padding: 10px 18px; }
</style>
</head>
<body>
<!-- A sign-up form that leaves validation to the browser, the way plain HTML forms do: required
     fields and typed inputs. A submit with something missing is refused, and the reason appears in
     the browser's own bubble next to the field - it is never written into the page. -->
<h1>Create your account</h1>
<form id="signup">
  <label for="email">Email</label>
  <input type="email" id="email" name="email" required autocomplete="email">
  <label for="handle">Username</label>
  <input type="text" id="handle" name="handle" required pattern="[a-z0-9_]{3,16}" title="3-16 lowercase letters, digits or underscores">
  <div class="check"><input type="checkbox" id="terms" name="terms" required><label for="terms">I accept the Terms of Service</label></div>
  <button type="submit">Create account</button>
</form>
<p id="status"></p>
<script>
  document.getElementById('signup').addEventListener('submit', event => {
    event.preventDefault();
    const form = event.target;
    document.getElementById('status').textContent = 'Account created for ' + form.email.value + ' as @' + form.handle.value + '.';
  });
</script>
</body>
</html>
