<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Static</title></head>
<body>
<h1>Settings</h1>
<!-- A page that does nothing at all: no timers, no listeners, nothing that mutates after load.
     Clicking here can only be answered by the page staying exactly as it was, and the wait for
     that answer must cost the two frames it takes to see it rather than a whole budget. -->
<button id="apply" type="button">Apply</button>
<p>Nothing on this page ever changes.</p>
</body>
</html>
