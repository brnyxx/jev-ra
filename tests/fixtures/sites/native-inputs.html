<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Book a table</title>
<style>
  body { font: 15px/1.5 system-ui; margin: 0; padding: 24px; max-width: 520px; }
  label { display: block; margin: 12px 0 4px; }
  input { padding: 6px 8px; font: inherit; }
  button { margin-top: 16px; padding: 10px 18px; }
</style>
</head>
<body>
<!-- A booking form built from the browser's own typed inputs, the way restaurant and clinic sites
     ask for them: a date input, a time input and a number input. The browser draws each one and
     only accepts a value in its own format. -->
<h1>Book a table</h1>
<form id="booking">
  <label for="date">Date</label>
  <input type="date" id="date" name="date" min="2026-01-01" max="2027-12-31" required>
  <label for="time">Time</label>
  <input type="time" id="time" name="time" min="11:00" max="22:00" step="900" required>
  <label for="guests">Guests</label>
  <input type="number" id="guests" name="guests" min="1" max="12" value="2" required>
  <button type="submit">Find a table</button>
</form>
<p id="status"></p>
<script>
  document.getElementById('booking').addEventListener('submit', event => {
    event.preventDefault();
    const form = event.target;
    document.getElementById('status').textContent =
      'Looking for a table for ' + form.guests.value + ' on ' + form.date.value + ' at ' + form.time.value + '.';
  });
</script>
</body>
</html>
