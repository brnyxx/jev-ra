<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<style>body { font: 14px/1.5 system-ui; margin: 0; padding: 48px; } label { display: block; margin: 8px 0; }</style>
</head>
<body>
<!-- A sign-in form behind hCaptcha's checkbox, rendered the way hCaptcha's script fills its
     container: the checkbox frame, and both response fields it writes the token into. The frame
     is a local stand-in on another origin. -->
<h1>Sign in</h1>
<form action="/sites/static.html" method="get">
  <label>Email <input name="email" type="email"></label>
  <div class="h-captcha" data-sitekey="10000000-ffff-ffff-ffff-000000000001">
    <iframe tabindex="0" frameborder="0" scrolling="no" data-hcaptcha-widget-id="0jevra01"
      data-hcaptcha-response="" style="width: 303px; height: 78px; overflow: hidden;"></iframe>
    <textarea id="g-recaptcha-response-0jevra01" name="g-recaptcha-response" style="display: none;"></textarea>
    <textarea id="h-captcha-response-0jevra01" name="h-captcha-response" style="display: none;"></textarea>
  </div>
  <button type="submit">Sign in</button>
</form>
<script>
  const other = location.hostname === 'localhost' ? '127.0.0.1' : 'localhost';
  const frame = document.querySelector('.h-captcha iframe');
  frame.src = `${location.protocol}//${other}:${location.port}/sites/challenge-anchor.html`;
  addEventListener('message', event => {
    if (event.data?.jevRaCheck !== 'solved') return;
    frame.dataset.hcaptchaResponse = 'jevra-hcaptcha-token';
    for (const field of document.querySelectorAll('.h-captcha textarea')) field.value = 'jevra-hcaptcha-token';
  });
</script>
</body>
</html>
