        <rect class="box" x="20" y="150" width="220" height="130" rx="16"/>
        <text id="a-agent" class="h" x="40" y="182">Your agent</text>
        <text id="a-agent1" class="s" x="40" y="204">plans · supplies values</text>
        <text id="a-agent2" class="s" x="40" y="222">reads with browser_extract</text>
        <g transform="translate(40 240) scale(.9)"><use class="logo" href="#i-claude" width="22" height="22"/><use class="logo" href="#i-openai" x="30" width="22" height="22"/><use class="logo" href="#i-cursor" x="60" width="22" height="22"/><use class="logo" href="#i-mcp" x="90" width="22" height="22"/></g>

        
        <rect class="box core" x="330" y="40" width="390" height="350" rx="20"/>
        <text class="h" x="352" y="72">jev-ra</text>
        <text class="m" x="700" y="72" text-anchor="end">pip · npm · uvx</text>
        <rect class="inner" x="350" y="90" width="352" height="58" rx="12"/>
        <text x="368" y="114">MCP server · CLI</text>
        <text id="a-mcp1" class="s" x="368" y="134">browser_run · search · extract · act · 10 more</text>
        <rect class="inner" x="350" y="160" width="352" height="130" rx="12"/>
        <text id="a-eng" x="368" y="184">Engine</text>
        <text id="a-eng1" class="s" x="368" y="204">agent loop: observe → decide → act → verify</text>
        <text id="a-eng2" class="s" x="368" y="222">action space + policy: offered ops, guards, loop detection</text>
        <text id="a-eng3" class="s" x="368" y="240">values binding · escalation contract · budgets</text>
        <text class="m" x="368" y="270">jev_ra/agent.py · decide/policy.py · decide/questions.py</text>
        <rect class="inner" x="350" y="302" width="352" height="70" rx="12"/>
        <text id="a-core" x="368" y="326">Browser core</text>
        <text id="a-core1" class="s" x="368" y="346">snapshot.js in one Runtime.evaluate · trusted Input events</text>
        <text class="m" x="368" y="364">jev_ra/browser/session.py · snapshot.js</text>

        
        <rect class="box" x="870" y="60" width="210" height="120" rx="16"/>
        <text class="h" x="888" y="92">TypeSafe Jev</text>
        <text id="a-jev1" class="s" x="888" y="114">decision model · System One</text>
        <text id="a-jev2" class="s" x="888" y="132">via OpenRouter or direct</text>
        <g transform="translate(888 146)"><use class="logo" href="#i-openrouter" width="20" height="20"/><text class="m" x="28" y="15">jev-1.13 · HTTP/2</text></g>

        
        <rect class="box" x="870" y="250" width="210" height="120" rx="16"/>
        <text class="h" x="888" y="282">Chrome</text>
        <text id="a-chr1" class="s" x="888" y="304">your profile or a managed one</text>
        <text id="a-chr2" class="s" x="888" y="322">1280×900 · focus emulation</text>
        <g transform="translate(888 336)"><use class="logo" href="#i-chrome" width="20" height="20"/><text class="m" x="28" y="15">DevTools Protocol</text></g>

        
        <path class="wire" d="M240 215 H330"/><path class="flow" d="M240 211 H330"/><path class="flow back" d="M240 219 H330"/>
        <text class="lbl" x="285" y="198" text-anchor="middle">MCP · stdio</text>
        <text id="a-w1" class="m" x="285" y="240" text-anchor="middle">goal · values</text>
        <text id="a-w2" class="m" x="285" y="255" text-anchor="middle">result | escalate</text>

        <path class="wire" d="M720 120 H870"/><path class="flow" d="M720 116 H870"/><path class="flow back" d="M720 124 H870"/>
        <text id="a-w3" class="lbl" x="795" y="104" text-anchor="middle">state + questions</text>
        <text id="a-w4" class="m" x="795" y="144" text-anchor="middle">answers · ~300 ms</text>

        <path class="wire" d="M720 340 H870"/><path class="flow" d="M720 336 H870"/><path class="flow back" d="M720 344 H870"/>
        <text class="lbl" x="795" y="324" text-anchor="middle">CDP · ws://</text>
        <text id="a-w5" class="m" x="795" y="364" text-anchor="middle">snapshot · input</text>

        <text id="a-foot" class="m" x="20" y="410">One process per box; no queue, daemon, vector store or second model.</text>
      </svg>
