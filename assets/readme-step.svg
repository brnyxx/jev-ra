<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 432" width="1100" height="432" role="img" aria-label="How a step works: observe, decide, act, verify, finish or return; and wall time per step against browser-use"><style>text{fill:#F6F4EF;font-family:ui-sans-serif,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;text-anchor:middle}.h{font-weight:700;font-size:17px}.ms{fill:#FFB703;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.s{fill:#AEB6C2;font-size:12.5px}.m{fill:#6B7482;font-size:11.5px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-anchor:start}.bl{font-weight:700;font-size:15px;text-anchor:start}.val{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;text-anchor:end}.dot{fill:rgba(4,7,11,.9);stroke:rgba(246,244,239,.14);stroke-width:1.2;animation:light 6s linear infinite}@keyframes light{0%,4%{stroke:rgba(246,244,239,.14)}7%,18%{stroke:#FFB703;stroke-width:2}26%,100%{stroke:rgba(246,244,239,.14)}}.line{stroke:rgba(255,183,3,.3);stroke-width:1}.pulse{fill:#FFB703;animation:travel 6s linear infinite}@keyframes travel{0%{transform:translateX(0);opacity:0}3%{opacity:1}92%{transform:translateX(880px);opacity:1}100%{transform:translateX(880px);opacity:0}}.track{fill:rgba(4,7,11,.9);stroke:rgba(246,244,239,.12)}.fill{transform-box:fill-box;transform-origin:left;animation:grow 6s cubic-bezier(.2,.7,.2,1) infinite}.fill.bu{fill:#3a4250}.fill.jr{fill:#FFB703}@keyframes grow{0%{transform:scaleX(0)}80%{transform:scaleX(1)}92%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1100" height="432" rx="10" fill="#070A0F"/><line class="line" x1="110.0" y1="70" x2="990.0" y2="70"/><g><rect class="dot" style="animation-delay:0.0s" x="74.0" y="34" width="72" height="72" rx="6"/><svg x="94.0" y="54" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFB703" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><text class="h" x="110.0" y="140">Observe</text><text class="ms" x="110.0" y="162">1 CDP call</text><text class="s" x="110.0" y="186">one snapshot.js call:</text><text class="s" x="110.0" y="203">text + every control</text></g><g><rect class="dot" style="animation-delay:1.2s" x="294.0" y="34" width="72" height="72" rx="6"/><svg x="314.0" y="54" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFB703" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg><text class="h" x="330.0" y="140">Decide</text><text class="ms" x="330.0" y="162">~300 ms</text><text class="s" x="330.0" y="186">one Jev request,</text><text class="s" x="330.0" y="203">five typed questions</text></g><g><rect class="dot" style="animation-delay:2.4s" x="514.0" y="34" width="72" height="72" rx="6"/><svg x="534.0" y="54" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFB703" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 8-6 1.5L9.5 19 5 3z"/></svg><text class="h" x="550.0" y="140">Act</text><text class="ms" x="550.0" y="162">trusted input</text><text class="s" x="550.0" y="186">guard re-checked,</text><text class="s" x="550.0" y="203">trusted Input event</text></g><g><rect class="dot" style="animation-delay:3.5999999999999996s" x="734.0" y="34" width="72" height="72" rx="6"/><svg x="754.0" y="54" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFB703" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg><text class="h" x="770.0" y="140">Verify</text><text class="ms" x="770.0" y="162">deterministic</text><text class="s" x="770.0" y="186">before vs after diffed,</text><text class="s" x="770.0" y="203">loops detected</text></g><g><rect class="dot" style="animation-delay:4.8s" x="954.0" y="34" width="72" height="72" rx="6"/><svg x="974.0" y="54" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFB703" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6v5a4 4 0 0 1-4 4H5"/><path d="m9 11-4 4 4 4"/></svg><text class="h" x="990.0" y="140">Finish or return</text><text class="ms" x="990.0" y="162">10 reasons</text><text class="s" x="990.0" y="186">DONE only when verified,</text><text class="s" x="990.0" y="203">else a reason + candidates</text></g><circle class="pulse" cx="110.0" cy="70" r="6"/><text class="bl" x="40" y="266">browser-use</text><text class="m" x="40" y="283">flash_mode, gemini-3-flash</text><rect class="track" x="250" y="250" width="690" height="24" rx="3"/><rect class="fill bu" x="250" y="250" width="690" height="24" rx="3"/><text class="val" x="1060" y="267">5.8 s/step</text><text class="bl" x="40" y="324">jev-ra</text><text class="m" x="40" y="341">Jev, one decision per step</text><rect class="track" x="250" y="308" width="690" height="24" rx="3"/><rect class="fill jr" x="250" y="308" width="167" height="24" rx="3"/><text class="val" x="1060" y="325">1.4 s/step</text><text class="m" x="40" y="388">Wall time divided by steps on the Wikipedia task, 2026-09-18, both through OpenRouter: browser-use&#x27;s recorded run, 23.1 s / 4,</text><text class="m" x="40" y="405">against jev-ra&#x27;s 5-run median, 2.7 s / 2. A jev-ra step is a Jev decision (253-380 ms in the Flights run recorded that day) plus</text><text class="m" x="40" y="422">the page&#x27;s own load and settle time.</text></svg>
