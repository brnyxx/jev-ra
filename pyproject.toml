[project]
name = "jev-ra"
version = "0.1.0"
description = "A fast browser-use layer for CLI coding agents: MCP server, CLI and Python API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Brian Kim" }]
keywords = ["browser", "mcp", "agent", "cdp", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
dependencies = ["browser-harness[mcp]>=0.1.13,<0.2", "httpx[http2]>=0.28,<1"]

[project.scripts]
jev-ra = "jev_ra.cli:main"
jev-ra-mcp = "jev_ra.mcp_server:main"

[project.urls]
Homepage = "https://github.com/kim62210/jev-ra"
Repository = "https://github.com/kim62210/jev-ra"
Issues = "https://github.com/kim62210/jev-ra/issues"
Changelog = "https://github.com/kim62210/jev-ra/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_ra"]

[dependency-groups]
# pillow renders the side-by-side benchmark GIFs in scripts/; it is not a runtime dependency.
dev = ["pytest>=8.4,<9", "pytest-cov>=6,<8", "ruff>=0.14,<1", "ty>=0.0.82,<0.1", "pillow>=11,<14"]

[tool.ruff]
line-length = 120
# Authored brand assets and recorded benchmark runs are not project source.
extend-exclude = ["assets", "docs/benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "D"]
# The class is documented; __init__ and the dunders are not public API.
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests and one-off scripts are read top to bottom; their names are their documentation.
"tests/**" = ["D"]
"scripts/**" = ["D103"]

[tool.ty.src]
include = ["jev_ra"]

[tool.ty.rules]
unresolved-attribute = "error"
invalid-assignment = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: needs a reachable Chrome over CDP"]
addopts = "--cov=jev_ra --cov-report=term-missing:skip-covered --cov-fail-under=85"

[tool.coverage.run]
branch = true
omit = ["jev_ra/__main__.py"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError", "if TYPE_CHECKING:"]
